
static def formatAsBadgeSafe(var val) {
    if(!(val instanceof String))
        return val

    // Badges break if hyphens are present.
    return ((String) val).replaceAll("[- /]", "_")
}


tasks.register('update-doc-templates', Copy) {
    group = "squee-gradle"
    description = "Takes documents from a folder, expands any template variables, and then copies them to the root."
    doNotTrackState("Stops gradle from screaming - It doesn't let files get copied to the root if tracking state.")

    Map filteredSrc = project(":Core").properties.collectEntries {
        k, v -> [(k): formatAsBadgeSafe(v) ]
    }

    from "/template_docs"

    into "/"
    include "**"
    exclude "media/**"

    expand filteredSrc
}


def collectJars = tasks.register('collect-jars', Copy) {
    group = "squee-gradle"
    description = "Used to gather all the jars that can be published"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    dependsOn subprojects.collect({
        def discovered = it.tasks.findAll {
            it.name == "remapSourcesJar" || it.name == "remapJar"
        }

        return discovered == null
                ? []
                : discovered
    })

    def jarHolderDirs = []

    allprojects.each {
        File target = new File(it.buildDir, "libs")
        jarHolderDirs.add(target)
    }

    from jarHolderDirs
    include("*-release.jar")
    include("*-compat.jar")
    rename { String name -> {
        if(name.endsWith("-release.jar")) return name.substring(0, name.length() - 12) + ".jar"
        if(name.endsWith("-compat.jar")) return "compat/" + name.substring(0, name.length() - 11) + ".jar"

        return name
    }}
    into "$buildDir"
}

def cleanAll = tasks.register('clean-all') {
    group = "squee-gradle"
    description = "Runs a clean operation on every project"
    dependsOn allprojects.collect({
        Task t = it.tasks.findByName('clean')
        return t == null
                ? new ArrayList<>()
                : t
    })

    delete "build"
}

// This could do with a better implementation.
// As of right now, modules are only loaded outside of a dev environment.
// I think this is the definition of tha
def packageCompatModules = tasks.register('bundle-compat-modules', Copy) {
    group = "squee-gradle"
    description = "Takes the built compatability modules and includes them in the jar"
    dependsOn collectJars

    // Read Core's SOURCE fabric.mod.json, not the already-processed copy from
    // Core's build/resources/main — Core's processResources has already
    // replaced $compatibility_jars with a placeholder space, so expanding that
    // copy a second time is a no-op. Re-expanding the source here gives us
    // the final version of the file, with all other placeholders (version,
    // loader_version, etc.) also filled in, since we hand through
    // project(":Core").properties below.
    from new File(project(":Core").projectDir, "src/main/resources/").getPath()
    include("fabric.mod.json")
    into buildDir

    // Re-expanding the source template means every placeholder
    // (version, loader_version, yacl_version, etc.) has to be provided,
    // not just compatibility_jars. Mirror Core's processResources: start
    // from Core's full property bag and override compatibility_jars.
    Map expandArgs = new HashMap<>(project(":Core").properties)
    expandArgs.put("version", project(":Core").version)
    expandArgs.put("compatibility_jars", () -> {
        if(project.property("should_bundle_compat_modules").is(false))
            return ""

        String[] compatJarFileNames = new File("${buildDir}/compat").listFiles().toList()
                .stream()
                .map { "{ \"file\": \"compat/${it.name}\" }".toString() }
                .toArray(String[]::new)
        return String.join(",", compatJarFileNames)
    })
    expand(expandArgs)

    // Swap out bundled jar for
    doLast {
        // Gets tbe file name of the GrappleMod jar so that it can be updated
        // to include the new fabric.mod.json + the compatibility modules
        String modFileName = file(buildDir).listFiles().toList()
                .stream()
                .filter { it.name.toLowerCase().startsWith("grapplemod")}
                .findFirst()
                .orElseThrow().name

        // Ant's jar task with update=true merges files into the existing
        // archive in place. Gradle 9 removed Project.exec() for script tasks,
        // so shelling out to the `jar` CLI isn't an option — Ant is built in
        // and doesn't depend on the JDK's jar being on PATH.
        ant.jar(destfile: "${buildDir}/${modFileName}", update: "true") {
            fileset(dir: buildDir) {
                include(name: 'fabric.mod.json')
            }
            zipfileset(dir: "${buildDir}/compat", prefix: "compat")
        }
    }
}